worker_processes auto;
events { worker_connections 1024; }

http {
  # --- Edge rate limiting (coarse, per-IP) — absorbs floods before the app.
  #     The app tier adds precise per-identity limits via Redis.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conns:10m;

  upstream api_backend {
    least_conn;                 # spread by active connections
    server api:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Trust the immediate proxy for real client IPs (tune for Hetzner LB in prod).
  server {
    listen 80;
    server_name _;

    # Security headers (TLS/HSTS terminate at the Hetzner LB or here in prod).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    # Health checks bypass rate limiting.
    location = /healthz { proxy_pass http://api_backend; }
    location = /readyz  { proxy_pass http://api_backend; }

    location / {
      limit_req zone=api burst=40 nodelay;
      limit_conn conns 50;

      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
