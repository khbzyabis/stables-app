# Local / single-node stack: Postgres + Redis + two API replicas behind an
# Nginx load balancer. Mirrors production topology so what you test is what you
# ship. Self-hosted Supabase (Auth/Storage) runs from its own compose in
# production; for local API testing, Postgres + a JWT secret are enough.
name: my-stables

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: mystables
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mystables"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Applies migrations once, before the API replicas start — so scaling never
  # races on the schema.
  migrate:
    build: ../backend
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://app:devpassword@postgres:5432/mystables?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build: ../backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:devpassword@postgres:5432/mystables?schema=public
      REDIS_URL: redis://redis:6379
      SUPABASE_JWT_SECRET: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      RATE_LIMIT_TTL_MS: "60000"
      RATE_LIMIT_MAX: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Two replicas → the load balancer spreads traffic; either can die and the
    # service stays up. Rate limits stay correct because they live in Redis.
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
